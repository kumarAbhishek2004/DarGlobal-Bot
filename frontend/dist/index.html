<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DarGlobal AI Real Estate Advisor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D4AF37'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #212121;
      color: #ECECEC;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4a4a; }
    
    /* Clean ChatGPT typography */
    .chat-prose p { margin-bottom: 0.85rem; line-height: 1.65; }
    .chat-prose p:last-child { margin-bottom: 0; }
    .chat-prose strong { color: #ffffff; font-weight: 600; }
    .chat-prose h1, .chat-prose h2, .chat-prose h3, .chat-prose h4 { color: #ffffff; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; }
    .chat-prose h1 { font-size: 1.25rem; }
    .chat-prose h2 { font-size: 1.15rem; }
    .chat-prose h3 { font-size: 1.05rem; }
    .chat-prose ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.85rem; }
    .chat-prose ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.85rem; }
    .chat-prose li { margin-bottom: 0.35rem; line-height: 1.5; }
    .chat-prose a { color: #D4AF37; text-decoration: underline; text-underline-offset: 2px; }
    .chat-prose a:hover { color: #E5C358; }
    .chat-prose code { background: #2f2f2f; padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.85em; }
    .chat-prose blockquote { border-left: 3px solid #D4AF37; padding-left: 0.75rem; color: #a1a1aa; margin: 0.5rem 0; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col bg-[#212121]">

  <!-- Minimal Header -->
  <header class="h-14 flex items-center justify-between px-5 border-b border-[#2d2d2d] bg-[#212121]/95 shrink-0 z-20">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded-full bg-gradient-to-br from-[#D4AF37] to-[#8C6D23] flex items-center justify-center font-bold text-black text-xs shadow-sm">
        D
      </div>
      <span class="font-semibold text-sm text-white tracking-wide">DarGlobal AI</span>
    </div>

    <!-- New Chat Button -->
    <button
      onclick="startNewChat()"
      class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium text-gray-300 hover:text-white bg-[#2f2f2f] hover:bg-[#383838] border border-[#3d3d3d] transition shadow-sm"
      title="Start new conversation"
    >
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      <span>New chat</span>
    </button>
  </header>

  <!-- Central Chat Area -->
  <main class="flex-1 overflow-hidden flex flex-col relative">
    
    <!-- Messages Scrollbox -->
    <div id="scrollContainer" class="flex-1 overflow-y-auto px-4">
      <div id="chatContent" class="max-w-2xl mx-auto w-full py-8">

        <!-- Clean Empty State (ChatGPT-Style) -->
        <div id="emptyHero" class="min-h-[60vh] flex flex-col items-center justify-center text-center">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-[#D4AF37] to-[#8C6D23] flex items-center justify-center font-bold text-black text-base mb-4 shadow-md">
            D
          </div>
          <h2 class="text-2xl font-semibold text-white mb-2">
            What real estate property are you looking for?
          </h2>
          <p class="text-xs text-gray-400 mb-8 max-w-md">
            Ask questions about luxury branded residences (Pagani, Lamborghini, Trump) and verified Saudi listings on Wasalt.
          </p>

          <!-- 4 Clean Starter Prompts -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 w-full text-left">
            <button onclick="handleAsk(this.querySelector('p').innerText)" class="p-3.5 rounded-2xl bg-[#262626] hover:bg-[#2f2f2f] border border-[#333333] hover:border-gray-500 transition group">
              <span class="text-xs font-medium text-gray-200 group-hover:text-white block mb-0.5">Pagani Tower in Dubai</span>
              <p class="text-xs text-gray-400 line-clamp-1">Tell me about DaVinci Tower by Pagani in Dubai. What are the amenities and price?</p>
            </button>

            <button onclick="handleAsk(this.querySelector('p').innerText)" class="p-3.5 rounded-2xl bg-[#262626] hover:bg-[#2f2f2f] border border-[#333333] hover:border-gray-500 transition group">
              <span class="text-xs font-medium text-gray-200 group-hover:text-white block mb-0.5">Lamborghini Villas Spain</span>
              <p class="text-xs text-gray-400 line-clamp-1">What luxury villas does DarGlobal have in Spain? Describe Tierra Viva.</p>
            </button>

            <button onclick="handleAsk(this.querySelector('p').innerText)" class="p-3.5 rounded-2xl bg-[#262626] hover:bg-[#2f2f2f] border border-[#333333] hover:border-gray-500 transition group">
              <span class="text-xs font-medium text-gray-200 group-hover:text-white block mb-0.5">AIDA Oman Resort</span>
              <p class="text-xs text-gray-400 line-clamp-1">What is the AIDA project in Oman? Tell me about the Trump International resort.</p>
            </button>

            <button onclick="handleAsk(this.querySelector('p').innerText)" class="p-3.5 rounded-2xl bg-[#262626] hover:bg-[#2f2f2f] border border-[#333333] hover:border-gray-500 transition group">
              <span class="text-xs font-medium text-gray-200 group-hover:text-white block mb-0.5">Riyadh Listings on Wasalt</span>
              <p class="text-xs text-gray-400 line-clamp-1">What 3-bedroom residential properties are available for sale in Riyadh on Wasalt?</p>
            </button>
          </div>
        </div>

        <!-- Chat Messages -->
        <div id="messagesList" class="space-y-6"></div>

        <!-- Typing Indicator -->
        <div id="typingIndicator" class="hidden flex gap-3.5 items-start py-4">
          <div class="w-7 h-7 rounded-full bg-gradient-to-br from-[#D4AF37] to-[#8C6D23] flex items-center justify-center font-bold text-black text-xs shrink-0 mt-0.5">
            D
          </div>
          <div class="flex items-center gap-1.5 pt-1.5">
            <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce"></span>
            <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce [animation-delay:0.2s]"></span>
            <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce [animation-delay:0.4s]"></span>
          </div>
        </div>

      </div>
    </div>

    <!-- Floating Capsule Input (ChatGPT style) -->
    <div class="w-full max-w-2xl mx-auto px-4 pb-4 pt-1 shrink-0">
      <form id="chatForm" onsubmit="handleFormSubmit(event)" class="relative flex items-center bg-[#2f2f2f] rounded-3xl border border-[#3d3d3d] focus-within:border-gray-400 shadow-md transition">
        <textarea
          id="queryInput"
          rows="1"
          placeholder="Message DarGlobal AI Advisor..."
          onkeydown="handleKeyDown(event)"
          class="w-full bg-transparent text-white placeholder-gray-400 text-sm py-3.5 pl-5 pr-14 focus:outline-none resize-none max-h-36"
        ></textarea>
        <button
          type="submit"
          id="sendBtn"
          class="absolute right-2.5 w-8 h-8 rounded-full bg-white text-black hover:bg-gray-200 disabled:opacity-30 disabled:hover:bg-white flex items-center justify-center transition disabled:cursor-not-allowed shadow"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
        </button>
      </form>
      <div class="text-center text-[11px] text-gray-500 mt-2">
        DarGlobal AI Advisor can make mistakes. Verify important property details with official listings.
      </div>
    </div>

  </main>

  <script>
    let isWaiting = false;

    const scrollContainer = document.getElementById('scrollContainer');
    const emptyHero = document.getElementById('emptyHero');
    const messagesList = document.getElementById('messagesList');
    const queryInput = document.getElementById('queryInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    function startNewChat() {
      messagesList.innerHTML = '';
      if (emptyHero) emptyHero.style.display = 'flex';
      queryInput.value = '';
      queryInput.focus();
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleFormSubmit(e);
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const q = queryInput.value.trim();
      if (!q || isWaiting) return;
      handleAsk(q);
      queryInput.value = '';
    }

    async function handleAsk(query) {
      if (isWaiting) return;
      isWaiting = true;

      if (emptyHero) emptyHero.style.display = 'none';

      // 1. Append User Message
      appendUserMessage(query);

      // 2. Show typing indicator
      typingIndicator.classList.remove('hidden');
      scrollToBottom();
      sendBtn.disabled = true;

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: query,
            top_k: 4
          })
        });

        const data = await resp.json();
        typingIndicator.classList.add('hidden');
        appendAssistantMessage(data);
      } catch (err) {
        typingIndicator.classList.add('hidden');
        appendAssistantMessage({
          answer: `Unable to connect to server: ${err.message}`,
          sources: []
        });
      } finally {
        isWaiting = false;
        sendBtn.disabled = false;
        scrollToBottom();
      }
    }

    function appendUserMessage(text) {
      const row = document.createElement('div');
      row.className = 'flex justify-end';
      row.innerHTML = `
        <div class="bg-[#2f2f2f] text-white px-4 py-2.5 rounded-3xl max-w-[85%] text-sm leading-relaxed whitespace-pre-wrap">
          ${escapeHtml(text)}
        </div>
      `;
      messagesList.appendChild(row);
      scrollToBottom();
    }

    function appendAssistantMessage(data) {
      const row = document.createElement('div');
      row.className = 'flex gap-3.5 items-start';

      const parsedHtml = marked.parse(data.answer || '');

      // Clean sources pills
      let sourcesHtml = '';
      if (data.sources && data.sources.length > 0) {
        const pills = data.sources.map(s => {
          const isDG = s.source === 'DarGlobal';
          return `
            <a href="${s.url || '#'}" target="_blank" rel="noreferrer" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-[#171717] hover:bg-[#282828] border border-[#2f2f2f] text-[11px] text-gray-300 transition shrink-0 group">
              <span class="w-1.5 h-1.5 rounded-full ${isDG ? 'bg-[#D4AF37]' : 'bg-emerald-400'}"></span>
              <span class="font-medium text-white group-hover:text-[#D4AF37] truncate max-w-[150px]">${escapeHtml(s.title || '')}</span>
              ${s.price ? `<span class="text-gray-500 font-mono text-[10px]">• ${escapeHtml(s.price)}</span>` : ''}
              <svg class="w-3 h-3 text-gray-500 group-hover:text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            </a>
          `;
        }).join('');

        sourcesHtml = `
          <div class="mt-3 pt-3 border-t border-[#2a2a2a]">
            <div class="text-[11px] font-medium text-gray-400 mb-2">
              Verified Sources (${data.sources.length})
            </div>
            <div class="flex flex-wrap gap-1.5">
              ${pills}
            </div>
          </div>
        `;
      }

      row.innerHTML = `
        <div class="w-7 h-7 rounded-full bg-gradient-to-br from-[#D4AF37] to-[#8C6D23] flex items-center justify-center font-bold text-black text-xs shrink-0 mt-1">
          D
        </div>
        <div class="flex-1 overflow-hidden">
          <div class="chat-prose text-sm text-[#ECECEC]">
            ${parsedHtml}
          </div>
          ${sourcesHtml}
          <div class="mt-2 flex items-center gap-3 text-[11px] text-gray-500">
            ${data.latency_ms ? `<span>${data.latency_ms} ms</span>` : ''}
            <button onclick="copyToClipboard(this)" class="hover:text-gray-300 transition flex items-center gap-1" title="Copy text">
              <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
      `;

      messagesList.appendChild(row);
      scrollToBottom();
    }

    function scrollToBottom() {
      scrollContainer.scrollTop = scrollContainer.scrollHeight;
    }

    function copyToClipboard(btn) {
      const text = btn.closest('.flex-1').querySelector('.chat-prose').innerText;
      navigator.clipboard.writeText(text).then(() => {
        btn.querySelector('span').textContent = 'Copied!';
        setTimeout(() => { btn.querySelector('span').textContent = 'Copy'; }, 1500);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
